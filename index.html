<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷你超级玛丽</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87ceeb;
}

canvas{
  display:block;
}

#tip{
  position:fixed;
  top:10px;
  left:10px;
  background:white;
  padding:8px;
  border-radius:8px;
  font-family:sans-serif;
}
</style>
</head>

<body>

<div id="tip">
← →移动<br>
↑跳跃
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const player={
 x:100,
 y:300,
 w:40,
 h:40,
 vx:0,
 vy:0
};

const gravity=0.8;
let onGround=false;

const platforms=[
 {x:0,y:500,w:2000,h:100},
 {x:400,y:400,w:150,h:20},
 {x:700,y:320,w:150,h:20},
 {x:1000,y:250,w:150,h:20}
];

const goal={
 x:1400,
 y:150,
 w:40,
 h:100
};

const keys={};

document.addEventListener("keydown",e=>{
 keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

function update(){

 if(keys["ArrowLeft"]){
   player.vx=-5;
 }else if(keys["ArrowRight"]){
   player.vx=5;
 }else{
   player.vx=0;
 }

 if(keys["ArrowUp"] && onGround){
   player.vy=-15;
   onGround=false;
 }

 player.vy+=gravity;

 player.x+=player.vx;
 player.y+=player.vy;

 onGround=false;

 for(const p of platforms){

   if(
      player.x+player.w>p.x &&
      player.x<p.x+p.w &&
      player.y+player.h>p.y &&
      player.y+player.h<p.y+20 &&
      player.vy>0
   ){
      player.y=p.y-player.h;
      player.vy=0;
      onGround=true;
   }
 }

 if(
   player.x<goal.x+goal.w &&
   player.x+player.w>goal.x &&
   player.y<goal.y+goal.h &&
   player.y+player.h>goal.y
 ){
   alert("通关！");
   location.reload();
 }

 if(player.y>canvas.height+300){
   player.x=100;
   player.y=300;
   player.vy=0;
 }
}

function draw(){

 ctx.clearRect(0,0,canvas.width,canvas.height);

 const cameraX=player.x-200;

 ctx.save();
 ctx.translate(-cameraX,0);

 ctx.fillStyle="#654321";
 for(const p of platforms){
   ctx.fillRect(p.x,p.y,p.w,p.h);
 }

 ctx.fillStyle="red";
 ctx.fillRect(
   player.x,
   player.y,
   player.w,
   player.h
 );

 ctx.fillStyle="green";
 ctx.fillRect(
   goal.x,
   goal.y,
   goal.w,
   goal.h
 );

 ctx.restore();
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
